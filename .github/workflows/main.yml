name: Upload to App Store

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest

    steps:
      - name: Get code from repo
        uses: actions/checkout@v4

      - name: Find the IPA file
        id: find_ipa
        run: |
          IPA_FILE=$(find . -name "*.ipa" -type f | head -1)
          echo "Found IPA: $IPA_FILE"
          echo "ipa_file=$IPA_FILE" >> $GITHUB_OUTPUT

      - name: Setup Apple API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPSTORE_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "${{ steps.find_ipa.outputs.ipa_file }}" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --verbose

      - name: Cleanup key
        if: always()
        run: rm -f ~/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
